<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explorable · Every centrality against degree</title>
<link rel="stylesheet" href="https://sunelehmann.com/socialgraphs2026-web/css/tokens.css">
<link rel="stylesheet" href="https://sunelehmann.com/socialgraphs2026-web/explorables/explore.css">
<style>
  .panels { grid-template-columns: 3fr 2fr; }
  @media (max-width: 640px) { .panels { grid-template-columns: 1fr; } }
  svg.chart { height: 360px; cursor: crosshair; }
  .tip {
    position: absolute; pointer-events: none; display: none;
    background: var(--surface-1); border: 1px solid var(--baseline); border-radius: 7px;
    padding: 5px 9px; font-size: 12.5px; color: var(--text-primary);
    box-shadow: 0 2px 8px var(--border); white-space: nowrap; z-index: 2;
  }
  .tip .nm { font-weight: 600; }
  .tip .v { color: var(--text-secondary); }
  table.top { border-collapse: collapse; width: 100%; font-size: 13px; margin-top: 4px; }
  table.top th { font-weight: 600; color: var(--text-muted); text-align: left; font-size: 11.5px;
                 letter-spacing: 0.04em; padding: 2px 6px 4px 0; border-bottom: 1px solid var(--grid); }
  table.top td { padding: 3px 6px 3px 0; color: var(--text-secondary); border-bottom: 1px solid var(--grid);
                 font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.top td.nm { color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
  table.top td.num { text-align: right; }
  table.top tr.new td { color: var(--accent); }
  table.top tr.new td.nm { color: var(--accent); font-weight: 600; }
  table.top tr:hover td { background: var(--accent-wash); cursor: default; }
  .directlabel { paint-order: stroke; stroke: var(--surface-1); stroke-width: 3px; stroke-linejoin: round; }
  .zerorail { stroke: var(--baseline); stroke-width: 1; stroke-dasharray: 3 3; }
</style>
</head>
<body>

<div class="controls">
  <label>x
    <span class="seg" id="x-seg">
      <button data-v="degree" class="on">degree</button><button data-v="closeness">closeness</button><button data-v="harmonic">harmonic</button><button data-v="betweenness">betweenness</button><button data-v="eigenvector">eigenvector</button><button data-v="pagerank">PageRank</button>
    </span>
  </label>
  <label>y
    <span class="seg" id="y-seg">
      <button data-v="degree">degree</button><button data-v="closeness">closeness</button><button data-v="harmonic">harmonic</button><button data-v="betweenness" class="on">betweenness</button><button data-v="eigenvector">eigenvector</button><button data-v="pagerank">PageRank</button>
    </span>
  </label>
  <label>axes
    <span class="seg" id="ax-seg">
      <button data-v="log" class="on">log–log</button><button data-v="lin">linear</button>
    </span>
  </label>
</div>

<div class="panels">
  <div class="panel" style="position: relative">
    <h2 id="chart-title">Betweenness against degree</h2>
    <div class="legend" id="legend"></div>
    <svg class="chart" id="chart"></svg>
    <div class="tip" id="tip"></div>
  </div>
  <div class="panel">
    <h2 id="top-title">Top ten by betweenness</h2>
    <table class="top">
      <thead><tr><th>#</th><th>Character</th><th style="text-align:right" id="top-val">value</th><th style="text-align:right" id="top-rank">rank by x</th></tr></thead>
      <tbody id="top"></tbody>
    </table>
  </div>
</div>

<div class="readout">
  <div class="tile"><div class="label">Characters</div><div class="value" id="r-n">–</div></div>
  <div class="tile"><div class="label">Rank correlation (Spearman ρ)</div><div class="value" id="r-rho">–</div></div>
  <div class="tile"><div class="label">Top tens shared</div><div class="value" id="r-overlap">–</div></div>
  <div class="tile"><div class="label">At zero (on the dashed rail)</div><div class="value" id="r-zero">–</div></div>
</div>

<script src="https://sunelehmann.com/socialgraphs2026-web/vendor/d3.v7.min.js"></script>
<script src="https://sunelehmann.com/socialgraphs2026-web/explorables/vizkit.js"></script>
<script src="https://sunelehmann.com/socialgraphs2026-web/explorables/marvel.js"></script>
<script src="https://sunelehmann.com/socialgraphs2026-web/explorables/centrality-scatter.js"></script>
</body>
</html>
