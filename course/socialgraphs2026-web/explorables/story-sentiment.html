<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explorable · Two sentiment instruments through a novel</title>
<link rel="stylesheet" href="https://sunelehmann.com/socialgraphs2026-web/css/tokens.css">
<link rel="stylesheet" href="https://sunelehmann.com/socialgraphs2026-web/explorables/explore.css">
<link rel="stylesheet" href="https://sunelehmann.com/socialgraphs2026-web/explorables/meaning-explore.css">
<link rel="stylesheet" href="https://sunelehmann.com/socialgraphs2026-web/explorables/week7-explore.css">
</head>
<body>
<div class="controls">
  <span class="seg" id="instrument">
    <button data-v="both" class="on">both</button>
    <button data-v="clf">classifier</button>
    <button data-v="lex">lexicon</button>
  </span>
  <label>Smoothing <input id="window" type="range" min="1" max="41" step="2" value="11"> <span class="val" id="window-val">11 sentences</span></label>
</div>

<div class="arc-wrap">
  <div class="arc-panel">
    <h2>The whole novel, chapter by chapter
      <span class="legend"><span class="key"><span class="swatch" style="background:var(--accent)"></span>movie-review classifier (DistilBERT SST-2)</span><span class="key"><span class="swatch" style="background:var(--series-1)"></span>VADER lexicon</span></span>
    </h2>
    <svg id="novel" class="arc arc-novel plain" role="img" aria-label="Mean sentiment per chapter for both instruments"></svg>
  </div>
  <div class="arc-panel">
    <h2><span id="chapter-title">Inside chapter 1</span>
      <span class="chapter-nav"><button id="prev" title="previous chapter">‹</button><button id="next" title="next chapter">›</button></span>
      <span class="legend"><span class="key"><span class="swatch" style="background:var(--accent)"></span>classifier</span><span class="key"><span class="swatch" style="background:var(--series-1)"></span>lexicon</span></span>
    </h2>
    <svg id="main" class="arc arc-main" role="img" aria-label="Smoothed sentiment per sentence through the chapter"></svg>
  </div>
  <div class="tooltip wide" id="tip"></div>
</div>

<div class="arc-list cols-3">
  <div class="mini-k">where the classifier and the lexicon disagree most in this chapter</div>
  <ol id="disagree-list"></ol>
</div>
<div class="arc-foot" id="foot"></div>

<script src="https://sunelehmann.com/socialgraphs2026-web/vendor/d3.v7.min.js"></script>
<script src="https://sunelehmann.com/socialgraphs2026-web/explorables/story-sentiment.js"></script>
</body>
</html>
