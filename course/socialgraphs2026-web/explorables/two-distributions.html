<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explorable · Two distributions, four ways of looking</title>
<link rel="stylesheet" href="https://sunelehmann.com/socialgraphs2026-web/css/tokens.css">
<link rel="stylesheet" href="https://sunelehmann.com/socialgraphs2026-web/explorables/explore.css">
</head>
<body>

<div class="controls">
  <label>x-axis
    <span class="seg" id="x-seg">
      <button data-v="lin" class="on">linear</button><button data-v="log">log</button>
    </span>
  </label>
  <label>y-axis
    <span class="seg" id="y-seg">
      <button data-v="lin" class="on">linear</button><button data-v="log">log</button>
    </span>
  </label>
</div>

<div class="panels" style="grid-template-columns: 1fr">
  <div class="panel">
    <h2>The same two distributions, on the axes you choose</h2>
    <div class="legend">
      <span class="key"><span class="swatch" style="background: var(--series-1)"></span>power law · P(k) ∝ k<sup>−2.5</sup></span>
      <span class="key"><span class="swatch" style="background: var(--series-2)"></span>exponential · P(k) ∝ e<sup>−k/8</sup></span>
    </div>
    <svg class="chart" id="chart"></svg>
  </div>
</div>

<div class="readout">
  <div class="tile" style="max-width: 100%">
    <div class="label">On these axes</div>
    <div class="value" id="verdict" style="font-size: 15px; font-weight: 500"></div>
  </div>
</div>

<script src="https://sunelehmann.com/socialgraphs2026-web/vendor/d3.v7.min.js"></script>
<script src="https://sunelehmann.com/socialgraphs2026-web/explorables/vizkit.js"></script>
<script src="https://sunelehmann.com/socialgraphs2026-web/explorables/two-distributions.js"></script>
</body>
</html>
