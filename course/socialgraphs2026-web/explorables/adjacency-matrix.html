<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explorable · The adjacency matrix</title>
<link rel="stylesheet" href="https://sunelehmann.com/socialgraphs2026-web/css/tokens.css">
<link rel="stylesheet" href="https://sunelehmann.com/socialgraphs2026-web/explorables/explore.css">
<style>
  .matrix { display: grid; grid-template-columns: 26px repeat(8, 32px) 40px; gap: 3px; align-items: center; justify-content: start; }
  .matrix .hdr { text-align: center; font-size: 12px; color: var(--text-muted); font-weight: 600; }
  .matrix .sumhdr { font-size: 10.5px; color: var(--text-muted); text-align: center; line-height: 1.1; }
  .matrix input.cell {
    width: 32px; height: 30px; text-align: center; font: inherit;
    font-variant-numeric: tabular-nums; color: var(--text-primary);
    background: var(--surface-1); border: 1px solid var(--grid); border-radius: 6px;
  }
  .matrix input.cell:focus { outline: none; border-color: var(--accent); background: var(--accent-wash); }
  .matrix input.cell.filled { background: var(--series-1-wash); border-color: var(--baseline); }
  .matrix .diag {
    width: 32px; height: 30px; display: flex; align-items: center; justify-content: center;
    color: var(--text-muted); border: 1px dashed var(--grid); border-radius: 6px; font-size: 12px;
  }
  .matrix .sum { text-align: center; font-size: 12.5px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .matrix .sum strong { color: var(--text-primary); }
  .btnrow { display: flex; gap: 8px; margin-top: 10px; }
  svg.net { width: 100%; height: 380px; display: block; }
  .edgehead { fill: var(--series-1); }
  .note { font-size: 12px; color: var(--text-muted); margin-top: 8px; }
</style>
</head>
<body>

<div class="panels">
  <div class="panel">
    <h2>The network the matrix describes</h2>
    <svg class="net" id="net" viewBox="0 0 420 380"></svg>
  </div>
  <div class="panel">
    <h2>Adjacency matrix — a<sub>ij</sub> = edge from row i to column j</h2>
    <div class="matrix" id="matrix"></div>
    <div class="btnrow">
      <button id="b-example">example</button>
      <button id="b-symmetrize">symmetrize</button>
      <button id="b-clear">clear</button>
    </div>
    <p class="note">Type 1–9 into a cell to create an edge (bigger number = heavier edge).
      The dashed diagonal is off-limits: no self-loops in a simple network.</p>
  </div>
</div>

<div class="readout">
  <div class="tile"><div class="label">Nonzero entries (edges)</div><div class="value" id="r-edges">–</div></div>
  <div class="tile"><div class="label">Matrix symmetric?</div><div class="value" id="r-sym">–</div></div>
  <div class="tile"><div class="label">So the network is</div><div class="value" id="r-kind">–</div></div>
</div>

<script src="https://sunelehmann.com/socialgraphs2026-web/explorables/adjacency-matrix.js"></script>
</body>
</html>
