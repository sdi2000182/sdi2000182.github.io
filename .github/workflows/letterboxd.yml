name: Update Letterboxd watchlists

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch:
  push:
    paths:
      - 'watchlist/crew.json'

permissions:
  contents: write

concurrency:
  group: letterboxd-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock linkedom@0.18.5
      - run: node .github/scripts/fetch-letterboxd.mjs
      - name: Commit data
        run: |
          rm -rf node_modules
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add watchlist/data.json
          git diff --cached --quiet || (git commit -m "Update Letterboxd data" && git push)
