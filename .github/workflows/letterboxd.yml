name: Update Letterboxd watchlists

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch:
    inputs:
      add:
        description: 'Letterboxd usernames to add, comma separated (optionally username=Display Name)'
        required: false
        default: ''
      remove:
        description: 'Letterboxd usernames to remove, comma separated'
        required: false
        default: ''
  push:
    paths:
      - 'watchlist/crew.json'

permissions:
  contents: write

concurrency:
  group: letterboxd-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock linkedom@0.18.5
      - run: node .github/scripts/fetch-letterboxd.mjs
        env:
          ADD_USERS: ${{ github.event.inputs.add }}
          REMOVE_USERS: ${{ github.event.inputs.remove }}
      - name: Commit data
        run: |
          rm -rf node_modules
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add watchlist/data.json watchlist/crew.json
          git diff --cached --quiet || (git commit -m "Update Letterboxd data" && git pull --rebase && git push)
