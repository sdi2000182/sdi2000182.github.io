name: Crawl aviation accidents
on:
  push:
    branches: [course-fetch]
permissions:
  contents: write
jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q requests==2.32.3 networkx==3.3
      - run: python .github/scripts/aviation_crawl.py 2>&1 | tee crawl.log
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add aviation_graph.json crawl.log && git commit -m "aviation crawl" && git push
