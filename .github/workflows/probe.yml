name: Probe storage
on:
  push:
    branches: [lbx-test]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p debug; o=debug/ntfy.txt; T=kalees-probe-$RANDOM$RANDOM
          ( timeout 12 curl -sS -N "https://ntfy.sh/$T/json" > debug/stream.txt ) &
          sleep 2
          curl -sS -H 'Origin: https://sdi2000182.github.io' -d '{"op":"vote","k":"heat|1995","by":"eva"}' "https://ntfy.sh/$T" >> $o; echo >> $o
          curl -sS -d '{"op":"add","t":"Heat","y":1995}' "https://ntfy.sh/$T" > /dev/null
          sleep 3
          echo "== poll since=all" >> $o
          curl -sS "https://ntfy.sh/$T/json?poll=1&since=all" >> $o
          echo "== poll w/ Origin" >> $o
          curl -sS -i -H 'Origin: https://sdi2000182.github.io' "https://ntfy.sh/$T/json?poll=1&since=all" | grep -iE '^HTTP|access-control|"message"' >> $o
          wait
          echo "== live stream got" >> $o; cat debug/stream.txt >> $o
          cat $o
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add debug && git commit -m probe && git push
